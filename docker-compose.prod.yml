name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .env}

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:?}
  APP_ENV: ${APP_ENV:?}
  APP_KEY: ${APP_KEY:?}
  APP_DEBUG: ${APP_DEBUG:?}
  APP_URL: ${APP_URL:?}
  APP_LOCALE: ${APP_LOCALE:?}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:?}
  APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:?}
  LOG_CHANNEL: ${LOG_CHANNEL:?}
  LOG_STACK: ${LOG_STACK:?}
  LOG_LEVEL: ${LOG_LEVEL:?}
  DB_CONNECTION: ${DB_CONNECTION:?}
  DB_HOST: ${DB_HOST:?}
  DB_PORT: ${DB_PORT:?}
  DB_DATABASE: ${DB_DATABASE:?}
  DB_USERNAME: ${DB_USERNAME:?}
  DB_PASSWORD: ${DB_PASSWORD:?}
  SESSION_DRIVER: ${SESSION_DRIVER:?}
  SESSION_LIFETIME: ${SESSION_LIFETIME:?}
  SESSION_CONNECTION: ${SESSION_CONNECTION:?}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:?}
  CACHE_STORE: ${CACHE_STORE:?}
  CACHE_PREFIX: ${CACHE_PREFIX:?}
  REDIS_HOST: ${REDIS_HOST:?}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  REDIS_PORT: ${REDIS_PORT:?}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:?}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:?}
  MAIL_MAILER: ${MAIL_MAILER:?}
  MAIL_HOST: ${MAIL_HOST:?}
  MAIL_PORT: ${MAIL_PORT:?}
  MAIL_USERNAME: ${MAIL_USERNAME?}
  MAIL_PASSWORD: ${MAIL_PASSWORD?}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:?}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:?}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:?}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:?}
    restart: unless-stopped
    user: "www-data"
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:?}
    volumes:
      - app_code:/var/www/html:ro
      - ./storage:/var/www/html/storage
      - app_bootstrap:/var/www/html/bootstrap/cache
      - ./public/uploads:/var/www/html/public/uploads
      - ${BACKUP_PATH:?}:/backups
    networks:
      - internal
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php-fpm", "-F"]
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  queue:
    image: ${APP_IMAGE:?}
    restart: unless-stopped
    user: "www-data"
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    volumes:
      - app_code:/var/www/html:ro
      - ./storage:/var/www/html/storage
      - app_bootstrap:/var/www/html/bootstrap/cache
      - ./public/uploads:/var/www/html/public/uploads
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--memory=512"]

  scheduler:
    image: ${APP_IMAGE:?}
    restart: unless-stopped
    user: "www-data"
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    volumes:
      - app_code:/var/www/html:ro
      - ./storage:/var/www/html/storage
      - app_bootstrap:/var/www/html/bootstrap/cache
      - ./public/uploads:/var/www/html/public/uploads
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:?}:${HTTP_PORT:?}:8080"
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - app_code:/var/www/html:ro
      - ./storage:/var/www/html/storage:ro
      - ./public/uploads:/var/www/html/public/uploads:ro
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    user: "mysql"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${DB_DATABASE:?}
      MYSQL_USER: ${DB_USERNAME:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  app_code:
  app_bootstrap:
  mysql_data:
  redis_data:

networks:
  internal:
    driver: bridge
    internal: true
