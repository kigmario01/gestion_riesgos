services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: riskguard-app:latest
    container_name: riskguard-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      APP_LOCALE: ${APP_LOCALE:-es}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-es}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-es_ES}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-riskguard}
      DB_USERNAME: ${DB_USERNAME:-riskguard}
      DB_PASSWORD: ${DB_PASSWORD:-riskguard}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_CONNECTION: ${SESSION_CONNECTION:-default}
      CACHE_STORE: ${CACHE_STORE:-redis}
      CACHE_PREFIX: ${CACHE_PREFIX:-riskguard}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@riskguard.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-RiskGuard TI}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap:/var/www/html/bootstrap/cache
      - app_uploads:/var/www/html/public/uploads
      - app_logs:/var/www/html/storage/logs
    networks:
      - riskguard_internal
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: riskguard-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - app_storage:/var/www/html/storage:ro
      - app_uploads:/var/www/html/public/uploads:ro
      - app_logs:/var/www/html/storage/logs
    networks:
      - riskguard_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 15s

  mysql:
    image: mysql:8.4
    container_name: riskguard-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=caching_sha2_password --innodb_log_file_size=256M --sql_mode="STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-riskguard_root}
      MYSQL_DATABASE: ${DB_DATABASE:-riskguard}
      MYSQL_USER: ${DB_USERNAME:-riskguard}
      MYSQL_PASSWORD: ${DB_PASSWORD:-riskguard}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - riskguard_internal

  redis:
    image: redis:7.2-alpine
    container_name: riskguard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - riskguard_internal

volumes:
  mysql_data:
  redis_data:
  app_storage:
  app_bootstrap:
  app_uploads:
  app_logs:

networks:
  riskguard_internal:
    driver: bridge
    name: riskguard_internal
